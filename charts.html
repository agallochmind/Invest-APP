<!DOCTYPE html>
<html lang="zh-CN">
  <head>
      <meta charset="UTF-8">
      <title>XInvest</title>

      <!-- iPhone 窗口适配设置-->
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
      <!-- 开启 iOS 上的全屏模式（隐藏 Safari 栏） -->
      <meta name="apple-mobile-web-app-capable" content="yes">
      <!-- 设置状态栏颜色（可选 default / black / black-translucent） -->
      <meta name="apple-mobile-web-app-status-bar-style" content="default">
      <!-- 设置苹果专属的桌面图标（直接把图标设为苹果可识别的快捷图标） -->
      <link rel="apple-touch-icon" href="icon-192.png">


      <script type="text/javascript" src="lightweight-charts.standalone.production.js"></script>
      <script type="text/javascript" src="generate_data.js"></script>
      <link rel="stylesheet" href="style.css">

  </head>
  <body>

    <!-- App 顶部导航栏 -->
    <header class="app-header">
      <div class="header-title">我的工具</div>
    </header>

    <!-- App 中间核心内容区（只有这里可以滚动） -->
    <main class="app-content">
      <div class="card">
        <!-- 2. 准备一个用于挂载图表的 DOM 容器 -->
        <div id="chart-container"></div>
      </div>


        <script>
          const chart = LightweightCharts.createChart(
            document.getElementById('chart-container'),
            {
              height: 520,
              layout: {
                background: {color: '#222'},
                textColor: '#DDD',
              },
              grid: {
                vertLines: {color: '#444'},
                horzLines: {color: '#444'},
              },
            }
          );
          // Setting the border color for the vertical axis
          chart.priceScale('right').applyOptions({
              borderColor: '#71649C',
          });

          // Setting the border color for the horizontal axis
          chart.timeScale().applyOptions({
              borderColor: '#71649C',
          });

          const candlestickSeries = chart.addSeries(LightweightCharts.CandlestickSeries, {
              upColor: '#26a69a', 
              downColor: '#ef5350', 
              borderVisible: false,
              wickUpColor: '#26a69a', 
              wickDownColor: '#ef5350',
          });

          // 读取kline_data.csv文件中的数据，设置为蜡烛图数据
          const cline_data = generateCandlestickData();
          candlestickSeries.setData(cline_data);

          chart.timeScale().fitContent();
        </script>
    </main>

    <!-- App 底部标签栏 -->
    <footer class="app-footer">
      <a href="index.html" class="footer-item">首页</a>
      <a href="settings.html" class="footer-item">设置</a>
      <a href="charts.html" class="footer-item active">图表</a>
    </footer>

  </body>
</html>
