<!DOCTYPE html>
<html lang="zh-CN">
  <head>
      <meta charset="UTF-8">
      <title>XInvest</title>

      <!-- iPhone 窗口适配设置-->
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
      <!-- 关联刚才创建的 PWA 配置文件 -->
      <link rel="manifest" href="manifest.json">
      <!-- 开启 iOS 上的全屏模式（隐藏 Safari 栏） -->
      <meta name="apple-mobile-web-app-capable" content="yes">
      <!-- 设置状态栏颜色（可选 default / black / black-translucent） -->
      <meta name="apple-mobile-web-app-status-bar-style" content="default">
      <!-- 设置苹果专属的桌面图标（直接把图标设为苹果可识别的快捷图标） -->
      <link rel="apple-touch-icon" href="icon-192.png">
      <!-- 注册 Service Worker 的脚本 -->
      <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('Service Worker 注册成功！', reg.scope))
                .catch(err => console.log('Service Worker 注册失败：', err));
            });
        }
      </script>

      <script src="lightweight-charts.standalone.production.js"></script>
      <link rel="stylesheet" href="style.css">

  </head>
  <body>

    <!-- App 顶部导航栏 -->
    <header class="app-header">
      <div class="header-title">我的工具</div>
    </header>

    <!-- App 中间核心内容区（只有这里可以滚动） -->
    <main class="app-content">
      <div class="card">
        <!-- 2. 准备一个用于挂载图表的 DOM 容器 -->
        <div id="chart-container"></div>

        <script>
        </script>
      </div>
    </main>

    <!-- App 底部标签栏 -->
    <!-- 进入哪个页面，对应的链接会高亮显示 -->
    <footer class="app-footer">
      <a href="index.html" class="footer-item active">首页</a>
      <a href="settings.html" class="footer-item">设置</a>
      <a href="charts.html" class="footer-item">图表</a>
    </footer>

  </body>
</html>
