<!DOCTYPE html>
<html lang="zh-CN">
  <head>
      <meta charset="UTF-8">
      <!-- iPhone 窗口适配设置-->
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

      <!-- 关联刚才创建的 PWA 配置文件 -->
      <link rel="manifest" href="manifest.json">
      <!-- 开启 iOS 上的全屏模式（隐藏 Safari 栏） -->
      <meta name="apple-mobile-web-app-capable" content="yes">
      <!-- 设置状态栏颜色（可选 default / black / black-translucent） -->
      <meta name="apple-mobile-web-app-status-bar-style" content="default">
      <!-- 设置苹果专属的桌面图标（直接把图标设为苹果可识别的快捷图标） -->
      <link rel="apple-touch-icon" href="icon-192.png">

      <!-- 注册 Service Worker 的脚本 -->
      <script>
      if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
              .then(reg => console.log('Service Worker 注册成功！', reg.scope))
              .catch(err => console.log('Service Worker 注册失败：', err));
          });
      }
      </script>
      
      <title>XInvest</title>

      <link rel="stylesheet" href="style.css">

  </head>
  <body>

    <!-- App 顶部导航栏 -->
    <header class="app-header">
      <div class="header-title">我的工具</div>
    </header>

    <!-- App 中间核心内容区（只有这里可以滚动） -->
    <main class="app-content">
      <div class="card">
        <h3>欢迎使用</h3>
        <p>这是一个完美的单页工具布局，顶部和底部固定，中间内容可滑动。</p>
      </div>
      
      <!-- 示例：你可以把你的按钮、输入框、计算器键盘等放在这里 -->
      <div class="card">
        <button class="app-btn">点击操作</button>
      </div>

      <!-- 制造一些占位内容测试滚动效果 -->
      <div class="card" style="height: 400px; display: flex; align-items: center; justify-content: center; background: #f0f0f0;">
        内容区域占位
        啊手动阀手动阀
      </div>
    </main>

    <!-- App 底部标签栏 -->
    <footer class="app-footer">
      <a href="index.html" class="footer-item active">首页</a>
      <a href="settings.html" class="footer-item">设置</a>
    </footer>

    <!-- PWA 注册脚本 -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(err => console.log(err));
        });
      }
    </script>
  </body>
</html>
